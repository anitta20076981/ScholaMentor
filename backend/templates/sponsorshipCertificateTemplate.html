<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sponsorship Certificate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      border: 10px solid #007bff;
      background-color: #f9f9f9;
    }
    .title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 20px;
      text-decoration: underline;
      color: #007bff;
    }
    .content {
      font-size: 20px;
      margin: 20px 0;
      line-height: 1.6;
    }
    .signature {
      margin-top: 80px;
      text-align: right;
      font-size: 16px;
    }
    .logo {
      width: 100px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="title">Sponsorship Certificate</div>

  <div class="content">
    This is to certify that <strong>{{studentName}}</strong><br>
    has been granted a sponsorship from <strong>{{sponsorName}}</strong>.<br><br>

    The sponsorship amount is <strong>{{sponsorshipAmount}}</strong> covering <strong>{{sponsorshipPurpose}}</strong>.<br><br>

    This sponsorship has been approved on <strong>{{approvalDate}}</strong>.
  </div>

  <div class="signature">
    ___________________<br>
    Authorized Signature
  </div>
</body>
</html>
